[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeask"
version = "0.1.0"
description = "Local CLI for understanding unfamiliar repositories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer==0.12.3",
    "rich==13.7.1",
    "pathspec==0.12.1",
    "sentence-transformers==3.0.1",
    "chromadb==0.5.3",
    "anthropic==0.28.0",
    "python-dotenv==1.0.1",
]

[project.scripts]
codeask = "codeask.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["codeask*"]
